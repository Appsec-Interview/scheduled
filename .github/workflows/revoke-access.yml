name: Revoke Student Access

on:
  schedule:
    - cron: "*/5 * * * *"  # Runs every 5th minute

jobs:
  revoke_access:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Remove students after 20 minutes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ORG_NAME: "your-org-name"
        run: |
          repos=$(gh repo list "$ORG_NAME" --json name,createdAt --jq '.[] | select((now - (.createdAt | fromdateiso8601)) > 900) | .name')

          for repo in $repos; do
            echo "Processing $repo"
            collaborators=$(gh api "/repos/$ORG_NAME/$repo/collaborators" --jq '.[].login')
            
            for user in $collaborators; do
              echo "Removing $user from $repo"
              gh api --method DELETE "/repos/$ORG_NAME/$repo/collaborators/$user"
            done
          done
